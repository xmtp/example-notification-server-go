name: Tests
on:
  pull_request:
jobs:
  test:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v3
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-xnet
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: ./dev/up
      - name: Run Tests
        run: go test -p 1 ./...
  integration:
    name: Integration (V3 writes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/setup-xnet
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: ./dev/up
      - run: ./dev/integration v3-writes
  integration-v4:
    name: Integration (V4 writes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/setup-xnet
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: ./dev/up
      - run: ./dev/integration v4-writes
